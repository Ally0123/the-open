<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Open | Pro Dashboard</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d0d0d; --surface: #141414; --surface2: #1a1a1a;
    --border: #2a2a2a; --gold: #c8a84b; --text: #d4d4d4;
    --up: #26a69a; --down: #ef5350;
  }

  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; margin: 0; padding: 20px; }
  
  /* Sections */
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 15px; margin-bottom: 20px; }
  h2 { font-family: 'IBM Plex Mono'; font-size: 14px; text-transform: uppercase; color: var(--gold); margin: 0 0 15px 0; }

  /* Futures Cards */
  .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .future-card { 
    padding: 12px; border: 1px solid var(--border); border-radius: 4px; 
    cursor: pointer; transition: 0.2s; background: var(--surface2);
  }
  .future-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .up { color: var(--up); } .down { color: var(--down); }
  .future-sym { font-weight: 600; font-size: 16px; }
  .future-price { font-family: 'IBM Plex Mono'; font-size: 14px; margin-top: 4px; }

  /* Modal Styling */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
  }
  .modal-content {
    width: 90%; max-width: 1000px; background: var(--surface); 
    border: 1px solid var(--gold); border-radius: 8px; padding: 20px; position: relative;
  }
  .close-btn {
    position: absolute; top: 10px; right: 20px; font-size: 30px; 
    color: var(--gold); cursor: pointer; font-family: 'IBM Plex Mono';
  }
  #chart-container { height: 500px; width: 100%; }
</style>
</head>
<body>

<section>
  <h2>Global Futures (Click to expand)</h2>
  <div id="futuresContent" class="data-grid"></div>
</section>

<div id="chartModal" class="modal-overlay">
  <div class="modal-content">
    <span class="close-btn" onclick="closeChart()">&times;</span>
    <h2 id="modalTitle" style="margin-top:0">CHART</h2>
    <div id="chart-container"></div>
  </div>
</div>

<script>
  const TWELVE_KEY = '4fd31bffe6ef43799611d169c7e97ade';
  const proxyURL = (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

  const FUTURES_CONFIG = [
    { symbol: 'ES',  name: 'S&P 500',    td: 'ES',   tv: 'CME_MINI:ES1!' },
    { symbol: 'NQ',  name: 'Nasdaq 100', td: 'NQ',   tv: 'CME_MINI:NQ1!' },
    { symbol: 'GC',  name: 'Gold',       td: 'GOLD', tv: 'COMEX:GC1!'    },
    { symbol: 'CL',  name: 'Crude Oil',  td: 'CL',   tv: 'NYMEX:CL1!'    },
    { symbol: 'RTY', name: 'Russell',    td: 'RTY',  tv: 'CME_MINI:RTY1!'}
  ];

  async function fetchFutures() {
    const container = document.getElementById('futuresContent');
    const results = await Promise.all(FUTURES_CONFIG.map(async f => {
      try {
        const res = await fetch(proxyURL(`https://api.twelvedata.com/quote?symbol=${f.td}&apikey=${TWELVE_KEY}`));
        const outer = await res.json();
        const data = JSON.parse(outer.contents);
        return { ...f, price: data.close || '—', pct: data.percent_change || '0' };
      } catch (e) { return { ...f, price: '—', pct: '0' }; }
    }));

    container.innerHTML = results.map(f => `
      <div class="future-card ${parseFloat(f.pct) >= 0 ? 'up' : 'down'}" onclick="openChart('${f.tv}', '${f.name}')">
        <div class="future-sym">${f.symbol}</div>
        <div style="font-size:11px; opacity:0.6">${f.name}</div>
        <div class="future-price">${f.price}</div>
        <div style="font-size:12px">${parseFloat(f.pct) > 0 ? '+' : ''}${f.pct}%</div>
      </div>
    `).join('');
  }

  // ── CHART LOGIC ──
  function openChart(tvSymbol, displayName) {
    document.getElementById('modalTitle').textContent = displayName.toUpperCase() + " CONTINUOUS";
    document.getElementById('chartModal').style.display = 'flex';
    
    // Create the TradingView Widget
    new TradingView.widget({
      "autosize": true,
      "symbol": tvSymbol,
      "interval": "60",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "save_image": false,
      "container_id": "chart-container"
    });
  }

  function closeChart() {
    document.getElementById('chartModal').style.display = 'none';
    document.getElementById('chart-container').innerHTML = ''; // Reset container
  }

  // Close modal if user clicks outside the content box
  window.onclick = function(event) {
    const modal = document.getElementById('chartModal');
    if (event.target == modal) closeChart();
  }

  fetchFutures();
</script>
</body>
</html>
