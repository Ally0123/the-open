<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Open | Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --border: #2a2a2a;
    --gold: #c8a84b;
    --dim: #888;
    --text: #d4d4d4;
    --bright: #f0f0f0;
    --green: #00c076;
    --red: #ff4444;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--gold);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
  }

  .logo-title {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── PULSE STRIP ── */
  .pulse-strip {
    background: #0a0a0a;
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .pulse-item {
    padding: 8px 14px;
    border-right: 1px solid var(--border);
    min-width: 90px;
  }

  .pulse-label {
    font-family: var(--mono);
    font-size: 0.55rem;
    color: var(--dim);
    text-transform: uppercase;
  }

  .pulse-value {
    font-family: var(--mono);
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--bright);
  }

  /* ── ACTION BAR ── */
  .action-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .btn {
    background: #1a1a1a;
    color: var(--dim);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 10px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    border-radius: 2px;
  }

  .btn.primary {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn.claude {
    border-color: #c87040;
    color: #e0904a;
  }

  /* ── CONTENT ── */
  .content { padding: 12px; max-width: 900px; margin: 0 auto; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 8px;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 600;
  }

  .divider { flex: 1; height: 1px; background: var(--border); }

  /* ── NEWS ITEMS ── */
  .news-item {
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 4px;
    padding: 10px;
    border-left: 2px solid var(--border);
  }

  .news-item:hover { border-left-color: var(--gold); }

  .news-headline { font-size: 0.85rem; color: var(--bright); line-height: 1.4; }
  .news-source { font-family: var(--mono); font-size: 0.6rem; color: var(--gold); text-transform: uppercase; margin-top: 4px; }

</style>
</head>
<body>

<div class="header">
  <div class="logo-text">
    <span class="logo-title">The Open</span>
  </div>
  <div style="text-align: right;">
    <div id="headerDate" style="font-size: 0.6rem; color: var(--dim); font-family: var(--mono);"></div>
    <div id="headerTime" style="font-size: 0.8rem; color: var(--gold); font-family: var(--mono); font-weight: 600;"></div>
  </div>
</div>

<div class="pulse-strip" id="pulseStrip">
  </div>

<div class="action-bar">
  <button class="btn primary" onclick="fetchAllFeeds()">▶ Pull Intel</button>
  <button class="btn primary" onclick="fetchFutures()">Futures</button>
  <button class="btn" onclick="fetchFedWatch()">Fed Watch</button>
  <button class="btn claude" onclick="analyseHeadlines()">◆ Claude Synthesis</button>
</div>

<div class="content">
  <div id="futuresSection" style="display:none;">
    <div class="section-header"><span class="section-title">CME Futures</span><div class="divider"></div></div>
    <div id="futuresContent" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;"></div>
  </div>

  <div class="section-header"><span class="section-title">Macro Feed</span><div class="divider"></div></div>
  <div id="contentArea">
    <div style="text-align:center; padding: 40px; color: var(--dim); font-family: var(--mono); font-size: 0.7rem;">
      SYSTEM_IDLE: AWAITING_INPUT
    </div>
  </div>
</div>

<script>
  // Clock Logic
  function updateClock() {
    const now = new Date();
    document.getElementById('headerDate').textContent = now.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();
    document.getElementById('headerTime').textContent = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // API placeholders (keeping your existing functional logic)
  async function fetchAllFeeds() {
    const area = document.getElementById('contentArea');
    area.innerHTML = '<div style="padding:20px; font-family:var(--mono); font-size:0.7rem;">INITIATING_SIGNAL_SCAN...</div>';
    // Your existing RSS logic goes here
  }

  async function fetchFutures() {
    document.getElementById('futuresSection').style.display = 'block';
    // Your existing Yahoo/TwelveData logic goes here
  }

  // Simplified render example for news
  function renderNews(items) {
    const html = items.map(item => `
      <div class="news-item">
        <div class="news-headline">${item.title}</div>
        <div class="news-source">${item.source} // ${item.category}</div>
      </div>
    `).join('');
    document.getElementById('contentArea').innerHTML = html;
  }
</script>
</body>
</html>
