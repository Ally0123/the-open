<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TERMINAL - Morning Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #111111;
    --border: #333333;
    --text: #bbbbbb;
    --bright: #ffffff;
    --amber: #ff9900;
    --green: #00ff00;
    --red: #ff3333;
    --blue: #00aaff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.4;
    padding-bottom: 50px;
  }

  /* ── HEADER ── */
  .terminal-header {
    background: #1a1a1a;
    border-bottom: 1px solid var(--amber);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .terminal-header h1 {
    color: var(--amber);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .timestamp { color: var(--amber); font-size: 11px; }

  /* ── PULSE STRIP ── */
  .pulse-strip {
    display: flex;
    background: #000;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
  }
  .pulse-item {
    padding: 8px 15px;
    border-right: 1px solid var(--border);
    min-width: 100px;
  }
  .pulse-label { font-size: 10px; color: var(--text); display: block; }
  .pulse-value { font-weight: 700; color: var(--bright); font-size: 14px; }
  .pulse-change { font-size: 11px; margin-left: 4px; }
  .up { color: var(--green); }
  .down { color: var(--red); }

  /* ── FEAR & GREED ── */
  .fg-container {
    background: #000;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .fg-track {
    height: 4px;
    background: #222;
    flex: 1;
    position: relative;
  }
  .fg-needle {
    height: 12px;
    width: 2px;
    background: var(--amber);
    position: absolute;
    top: -4px;
    transition: left 0.5s;
  }

  /* ── CONTROLS ── */
  .nav-strip {
    background: #0a0a0a;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 5px;
    border-bottom: 1px solid var(--border);
  }
  .cmd-btn {
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    text-align: left;
    text-transform: uppercase;
  }
  .cmd-btn:hover { background: var(--amber); color: #000; border-color: var(--amber); }
  .cmd-btn.active { border-left: 3px solid var(--amber); color: var(--amber); }

  /* ── DATA GRIDS ── */
  .content-grid { padding: 15px; max-width: 1200px; margin: 0 auto; }
  
  .section-title {
    color: var(--amber);
    background: #111;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    border-left: 3px solid var(--amber);
    margin: 20px 0 10px;
    text-transform: uppercase;
  }

  .futures-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 2px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .future-card {
    background: var(--bg);
    padding: 10px;
    text-decoration: none;
    color: inherit;
  }
  .future-symbol { color: var(--amber); font-weight: 700; }
  .future-val { font-size: 16px; font-weight: 700; margin: 4px 0; }

  .news-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .news-item {
    background: var(--bg);
    padding: 12px;
    border-left: 2px solid transparent;
  }
  .news-item:hover { border-left-color: var(--amber); background: #080808; }
  .headline { color: var(--bright); font-weight: 600; cursor: pointer; }
  .source { color: var(--amber); font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
  .summary { font-size: 12px; color: #888; margin-top: 5px; display: none; }
  .news-item.open .summary { display: block; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #333; }
</style>
</head>
<body>

<div class="terminal-header">
  <h1>Terminal // Briefing</h1>
  <div class="timestamp" id="liveClock">--:--:--</div>
</div>

<div class="pulse-strip" id="pulseStrip">
  <div class="pulse-item"><span class="pulse-label">VIX</span><span id="pVIX" class="pulse-value">--</span><span id="pVIXc" class="pulse-change">--</span></div>
  <div class="pulse-item"><span class="pulse-label">DXY</span><span id="pDXY" class="pulse-value">--</span><span id="pDXYc" class="pulse-change">--</span></div>
  <div class="pulse-item"><span class="pulse-label">BTC/USD</span><span id="pBTC" class="pulse-value">--</span><span id="pBTCc" class="pulse-change">--</span></div>
  <div class="pulse-item"><span class="pulse-label">GOLD</span><span id="pGLD" class="pulse-value">--</span><span id="pGLDc" class="pulse-change">--</span></div>
  <div class="pulse-item"><span class="pulse-label">WTI</span><span id="pOIL" class="pulse-value">--</span><span id="pOILc" class="pulse-change">--</span></div>
</div>

<div class="fg-container">
  <span style="font-size:10px; color:var(--amber)">SENTIMENT:</span>
  <div class="fg-track"><div class="fg-needle" id="fgNeedle"></div></div>
  <span id="fgScore" style="color:var(--bright); font-weight:700">--</span>
</div>

<div class="nav-strip">
  <button class="cmd-btn" onclick="fetchAllFeeds()">1. PULL NEWS</button>
  <button class="cmd-btn" onclick="fetchFutures()">2. LOAD CME</button>
  <button class="cmd-btn" onclick="fetchTrending()">3. TOP MOVERS</button>
  <button class="cmd-btn" onclick="fetchFedWatch()">4. FED WATCH</button>
  <button class="cmd-btn" onclick="analyseHeadlines()" style="color:var(--amber)">5. RUN ANALYTICS (CLAUDE)</button>
</div>

<div class="content-grid">
  <div id="futuresSection" style="display:none">
    <div class="section-title">CME Globex Futures</div>
    <div id="futuresContent" class="futures-grid"></div>
  </div>

  <div id="newsSection">
    <div class="section-title">Global Macro Feed</div>
    <div id="contentArea" class="news-list">
      <div style="padding:40px; text-align:center; color:#444">READY FOR INPUT...</div>
    </div>
  </div>
</div>

  function renderFutures(futures) {

</body>
</html>
